[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piwigo-batch-uploader"
version = "0.1.0"
description = "Batch upload images to a self-hosted Piwigo gallery from a CSV, with album creation, friends-group sharing, and optional rotation."
readme = "readme.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "Jake Gustafson", email = "7557867+poikilos@users.noreply.github.com"}
]
maintainers = [
  {name = "Jake Gustafson", email = "7557867+poikilos@users.noreply.github.com"}
]
keywords = ["piwigo", "batch", "upload", "gallery", "photos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.25",
  "Pillow>=8.0",
]

[project.urls]
Homepage = "https://github.com/Hierosoft/piwigo-batch-uploader"
Repository = "https://github.com/Hierosoft/piwigo-batch-uploader"
Issues = "https://github.com/Hierosoft/piwigo-batch-uploader/issues"

[project.scripts]
piwigo-batch-uploader = "morepiwigo.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["morepiwigo*"]

[tool.setuptools]
include-package-data = true
